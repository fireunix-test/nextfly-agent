name: Private source CI
run-name: Build ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      request_id:
        required: true
        type: string
concurrency:
  group: private-ci-${{ inputs.pr_number }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  REPORT_EXPECTED: '["check (ubuntu-latest)", "check (macos-latest)", "check (windows-latest)", "fuzz (1/4)", "fuzz (2/4)", "fuzz (3/4)", "fuzz (4/4)"]'
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install cache encryption
        run: python -m pip install --disable-pip-version-check --quiet cryptography==50.0.2
      - name: Install Rust tools before fetching source
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable Rust
        run: rustup default stable
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@e77cc62a22a374a4d0668286007cc3e3b4c17760 # v1
      # Valgrind is a public Ubuntu package: its .deb files are cached in
      # the clear, per runner image, and installed without the network.
      - if: runner.os == 'Linux'
        name: Key the Valgrind packages to the runner image
        id: valgrind-key
        run: echo "key=valgrind-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux'
        name: Restore the Valgrind packages
        id: valgrind
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .valgrind-debs
          key: ${{ steps.valgrind-key.outputs.key }}
      - if: runner.os == 'Linux'
        name: Install Valgrind before fetching source
        timeout-minutes: 8
        run: bash scripts/install-valgrind.sh .valgrind-debs
      - if: runner.os == 'Linux' && steps.valgrind.outputs.cache-hit != 'true' && hashFiles('.valgrind-debs/*.deb') != ''
        name: Save the Valgrind packages
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .valgrind-debs
          key: ${{ steps.valgrind-key.outputs.key }}
      - name: Mint a read-only token for the private source
        id: source
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fireunix-nextfly
          repositories: agent
          permission-contents: read
          permission-pull-requests: read
      - name: Compute the cache key
        id: key
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CACHE_KIND: check
        run: python scripts/cache.py
      - name: Restore the encrypted cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Run private checks
        id: build
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          CACHE_SAVE: ${{ steps.restore.outputs.cache-hit != 'true' && '1' || '0' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORT_JOB: ${{ format('check ({0})', matrix.os) }}
          REPORT_PLATFORM: ${{ matrix.os }}
        run: python scripts/build.py check
      - name: Save the encrypted cache
        if: always() && steps.build.outputs.cache == 'written'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ steps.key.outputs.key }}
      - name: Mint a token for the private report
        if: always() && inputs.pr_number != '0'
        id: report
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fireunix-nextfly
          repositories: agent
          permission-pull-requests: write
      - name: Report privately to the PR
        if: always() && inputs.pr_number != '0'
        timeout-minutes: 5
        env:
          REPORT_TOKEN: ${{ steps.report.outputs.token }}
          BUILDER_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REPORT_JOB: ${{ format('check ({0})', matrix.os) }}
          REPORT_PLATFORM: ${{ matrix.os }}
        run: python scripts/report.py
  fuzz:
    if: github.ref == 'refs/heads/main'
    name: fuzz (${{ matrix.shard }}/4)
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match FUZZ_SHARDS in scripts/checks.py.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install cache encryption
        run: python -m pip install --disable-pip-version-check --quiet cryptography==50.0.2
      - name: Install nightly Rust before fetching source
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-fuzz
      - name: Mint a read-only token for the private source
        id: source
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fireunix-nextfly
          repositories: agent
          permission-contents: read
          permission-pull-requests: read
      - name: Compute the cache key
        id: key
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CACHE_KIND: fuzz
        run: python scripts/cache.py
      - name: Restore the encrypted cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Run private fuzz smoke tests
        id: build
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          # The shards build the same thing; one of them saves it.
          CACHE_SAVE: ${{ matrix.shard == 1 && steps.restore.outputs.cache-hit != 'true' && '1' || '0' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORT_JOB: ${{ format('fuzz ({0}/4)', matrix.shard) }}
          REPORT_PLATFORM: ubuntu-latest
          FUZZ_SHARD: ${{ matrix.shard }}
        run: python scripts/build.py fuzz "$FUZZ_SHARD"
      - name: Save the encrypted cache
        if: always() && steps.build.outputs.cache == 'written'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: ${{ steps.key.outputs.key }}
      - name: Mint a token for the private report
        if: always() && inputs.pr_number != '0'
        id: report
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fireunix-nextfly
          repositories: agent
          permission-pull-requests: write
      - name: Report privately to the PR
        if: always() && inputs.pr_number != '0'
        timeout-minutes: 5
        env:
          REPORT_TOKEN: ${{ steps.report.outputs.token }}
          BUILDER_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          REPORT_JOB: ${{ format('fuzz ({0}/4)', matrix.shard) }}
          REPORT_PLATFORM: ubuntu-latest
        run: python scripts/report.py
